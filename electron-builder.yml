appId: com.triasicbrowser.app
productName: Triasic
copyright: Copyright © 2026 Triasic

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

win:
  forceCodeSigning: false
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Network

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

extraResources:
  - from: build/icon.png
    to: triasic-icon.png

publish:
  provider: github
  owner: mrsantanu21
  repo: TriasicBrowser
