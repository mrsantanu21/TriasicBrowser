appId: com.triasicbrowser.app
productName: Triasic Browser
copyright: Copyright © 2024 Triasic Browser

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

win:
  forceCodeSigning: false
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Network

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: triasicbrowser
  repo: triasicbrowser
